[project]
name = "ncm-modelling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mubashshir", email = "mubashshir.uddin@terranxt.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy<2; python_version < '3.14'",
    "onnx>=1.19.0",
    "onnxruntime>=1.31.1",
    "pandas>=2.2,<3",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
    "umap-learn",
]

[project.scripts]
ncm-modelling = "ncm_modelling:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
